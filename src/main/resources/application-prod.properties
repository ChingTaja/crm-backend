# Production always uses HTTPS-only auth cookies.
app.auth.cookie.secure=true

# Render assigns PORT; local Docker runs default to 8080.
server.address=0.0.0.0
server.port=${PORT:8080}

# Production must use explicit deployment credentials and stable signing keys.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
app.jwt.secret=${JWT_SECRET}
app.auth.allowed-origins=${AUTH_ALLOWED_ORIGINS}
app.auth.reset-password-url=${FRONTEND_RESET_PASSWORD_URL}
