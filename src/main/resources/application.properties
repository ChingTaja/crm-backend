spring.application.name=crm-backend

spring.datasource.url=jdbc:postgresql://localhost:5432/crm
spring.datasource.username=taja
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


# Frontend reset page; production URL comes from the deployment environment.
app.auth.reset-password-url=${FRONTEND_RESET_PASSWORD_URL:http://localhost:5173/reset-password}
app.mail.from=${MAIL_FROM:${GMAIL_USERNAME:}}
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME:}
spring.mail.password=${GMAIL_APP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Set a shared Base64-encoded secret (at least 32 random bytes) for persistent/multi-instance deployments.
# Empty: generate an ephemeral random key at startup; restarting invalidates previous tokens.
app.jwt.secret=${JWT_SECRET:}
app.jwt.issuer=crm-backend
app.jwt.ttl=PT30M
