spring.application.name=crm-backend

spring.datasource.url=jdbc:postgresql://localhost:5432/crm
spring.datasource.username=taja
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


# Frontend reset page; production URL comes from the deployment environment.
app.auth.reset-password-url=${FRONTEND_RESET_PASSWORD_URL:http://localhost:5173/reset-password}
app.mail.from=${MAIL_FROM:${spring.mail.username:}}
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Set a shared Base64-encoded secret (at least 32 random bytes) for persistent/multi-instance deployments.
# Empty: generate an ephemeral random key at startup; restarting invalidates previous tokens.
app.jwt.secret=${JWT_SECRET:}
app.jwt.issuer=crm-backend
app.jwt.ttl=PT30M

# Preserve decimal precision in untyped advanced-search filter values.
spring.jackson.deserialization.use-big-decimal-for-floats=true

# Rotating refresh cookies; disable Secure only for local HTTP development.
app.refresh.ttl=${REFRESH_TOKEN_TTL:P7D}
app.auth.cookie.secure=${AUTH_COOKIE_SECURE:true}
app.auth.cookie.same-site=${AUTH_COOKIE_SAME_SITE:Lax}
app.auth.allowed-origins=${AUTH_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080}

# Per-instance token-bucket limits: capacity tokens replenished evenly over period.
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.max-keys=${RATE_LIMIT_MAX_KEYS:20000}
app.rate-limit.login-ip.capacity=${RATE_LIMIT_LOGIN_IP_CAPACITY:10}
app.rate-limit.login-ip.period=${RATE_LIMIT_LOGIN_IP_PERIOD:PT1M}
app.rate-limit.login-account.capacity=${RATE_LIMIT_LOGIN_ACCOUNT_CAPACITY:5}
app.rate-limit.login-account.period=${RATE_LIMIT_LOGIN_ACCOUNT_PERIOD:PT1M}
app.rate-limit.forgot-ip.capacity=${RATE_LIMIT_FORGOT_IP_CAPACITY:5}
app.rate-limit.forgot-ip.period=${RATE_LIMIT_FORGOT_IP_PERIOD:PT15M}
app.rate-limit.forgot-email.capacity=${RATE_LIMIT_FORGOT_EMAIL_CAPACITY:1}
app.rate-limit.forgot-email.period=${RATE_LIMIT_FORGOT_EMAIL_PERIOD:PT1M}
app.rate-limit.import-user.capacity=${RATE_LIMIT_IMPORT_USER_CAPACITY:5}
app.rate-limit.import-user.period=${RATE_LIMIT_IMPORT_USER_PERIOD:PT1M}
app.rate-limit.general-ip.capacity=${RATE_LIMIT_GENERAL_IP_CAPACITY:120}
app.rate-limit.general-ip.period=${RATE_LIMIT_GENERAL_IP_PERIOD:PT1M}
app.rate-limit.general-user.capacity=${RATE_LIMIT_GENERAL_USER_CAPACITY:300}
app.rate-limit.general-user.period=${RATE_LIMIT_GENERAL_USER_PERIOD:PT1M}
app.rate-limit.auth-ip.capacity=${RATE_LIMIT_AUTH_IP_CAPACITY:60}
app.rate-limit.auth-ip.period=${RATE_LIMIT_AUTH_IP_PERIOD:PT1M}
